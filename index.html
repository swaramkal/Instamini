<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subway Sprint</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="topbar">
        <div class="brand">Subway Sprint</div>
        <div class="score-wrap">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-wrap">
          <span>Best</span>
          <strong id="best">0</strong>
        </div>
      </div>

      <canvas id="gameCanvas" width="420" height="720" aria-label="Subway sprint game"></canvas>

      <div class="controls">
        <span>← → move</span>
        <span>↑ / Space jump</span>
        <span>Enter restart</span>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
